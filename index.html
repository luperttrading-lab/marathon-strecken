<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marathon-Strecken</title>
<style>
:root { --bg: #edf1f4; --surface: #ffffff; --ink: #102130; --muted: #586977; --rule: #d4dde5; --blue: #1b5bd0; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b141c; --surface: #121f2a; --ink: #e5ecf1; --muted: #93a3b0; --rule: #22364a; --blue: #6a9cff; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
h1 { margin: 0; font-size: 28px; }
a.card { display: block; padding: 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; }
a.card b { color: var(--blue); font-size: 18px; }
a.card span { display: block; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Marathon-Strecken</h1>
  <a class="card" href="hamburg/"><b>Hamburg</b><span>Steigungsprofil, Pace-Modell und Karte, Kurs 2025/2026</span></a>
</main>
</body>
</html>
